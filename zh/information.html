</header><main class="information-page" id="main-content"><h1>Andrew Yang</h1><p class="information-role">建筑设计与技术文档 · 墨尔本</p><p>Andrew Yang 是常驻墨尔本的建筑设计师，实践涵盖住宅建筑、展览及文化项目，工作经验包括概念设计、规划报批、施工图编制与专业顾问协调。</p><p>他拥有密歇根大学建筑学硕士及明尼苏达大学建筑学理学学士学位，曾在澳大利亚、美国、中国和日本参与建筑实践，并在哥本哈根学习建筑与城市设计。</p><p>他的工作注重将设计意图与项目落地所需的细节和协调相结合。建筑之外，他也从事活动与人像摄影。</p></main></div>
